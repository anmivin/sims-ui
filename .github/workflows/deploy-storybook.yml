name: gh-pages storybook deploy

on:
  push:
    branches:
      - 2025_1

jobs:
  deploy:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: set up node
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: install deps
        run: npm install

      - name: build
        run: npm run build-storybook

      - name: deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.STORYBOOK_SECRET }}
          publish_dir: ./storybook-static
